[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud_detection_ml"
version = "0.0.1"
description = "Fraud Detection Project encompassing Deep Learning, QML, and Traditional ML Algorithms"
authors = [
  { name = "Cheng Wei Lun" },
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "ipywidgets>=8.1.7",
    "loguru",
    "mkdocs",
    "numpy==1.26.4",
    "pandas==2.0.3",
    "pip",
    "pyspark>=4.0.1",
    "python-crfsuite>=0.9.11",
    "python-dotenv",
    "ray>=2.49.2",
    "ruff",
    "setuptools>=80.9.0",
    "spark>=0.2.1",
    "tqdm",
    "typer",
    "ydata-profiling>=4.17.0",
]
requires-python = ">=3.12.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["fraud_detection_ml"]
force-sort-within-sections = true

